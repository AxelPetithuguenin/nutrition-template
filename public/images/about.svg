<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500" role="img" aria-label="Portrait de la praticienne">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#F8F6F2"/>
      <stop offset="100%" stop-color="#EFEBE3"/>
    </linearGradient>
    <filter id="soft" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="168"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="7"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.055"/></feComponentTransfer>
    </filter>
  </defs>

  <rect width="1200" height="1500" fill="url(#bg)"/>
  <g filter="url(#soft)">
    <ellipse cx="410" cy="279" rx="403" ry="257" fill="#A8B59A" opacity="0.50"/>
    <ellipse cx="639" cy="569" rx="233" ry="199" fill="#FDFCFA" opacity="0.50"/>
    <ellipse cx="100" cy="660" rx="236" ry="152" fill="#C9A96A" opacity="0.50"/>
    <ellipse cx="518" cy="1191" rx="252" ry="179" fill="#A8B59A" opacity="0.50"/>
    <ellipse cx="738" cy="1354" rx="382" ry="305" fill="#FDFCFA" opacity="0.50"/>
  </g>
  <rect width="1200" height="1500" filter="url(#grain)" opacity="0.5"/>

  <g opacity="0.55" text-anchor="middle">
    <text x="600" y="750" font-family="Georgia, 'Times New Roman', serif" font-size="60" fill="#36413E">Portrait de la praticienne</text>
    <text x="600" y="846" font-family="Helvetica, Arial, sans-serif" font-size="31" letter-spacing="1.5" fill="#36413E" opacity="0.65">about.jpg · 1200 × 1500 px</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500" role="img" aria-label="Visuel de la méthode">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#F8F6F2"/>
      <stop offset="100%" stop-color="#EFEBE3"/>
    </linearGradient>
    <filter id="soft" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="168"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="11"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.055"/></feComponentTransfer>
    </filter>
  </defs>

  <rect width="1200" height="1500" fill="url(#bg)"/>
  <g filter="url(#soft)">
    <ellipse cx="549" cy="831" rx="482" ry="402" fill="#C9A96A" opacity="0.50"/>
    <ellipse cx="608" cy="868" rx="269" ry="230" fill="#A8B59A" opacity="0.50"/>
    <ellipse cx="740" cy="1146" rx="243" ry="183" fill="#FDFCFA" opacity="0.50"/>
    <ellipse cx="158" cy="1168" rx="416" ry="258" fill="#C9A96A" opacity="0.50"/>
    <ellipse cx="1121" cy="1377" rx="404" ry="367" fill="#A8B59A" opacity="0.50"/>
  </g>
  <rect width="1200" height="1500" filter="url(#grain)" opacity="0.5"/>

  <g opacity="0.55" text-anchor="middle">
    <text x="600" y="750" font-family="Georgia, 'Times New Roman', serif" font-size="60" fill="#36413E">Visuel de la méthode</text>
    <text x="600" y="846" font-family="Helvetica, Arial, sans-serif" font-size="31" letter-spacing="1.5" fill="#36413E" opacity="0.65">method.jpg · 1200 × 1500 px</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-label="Galerie 2">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#F8F6F2"/>
      <stop offset="100%" stop-color="#EFEBE3"/>
    </linearGradient>
    <filter id="soft" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="84"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="32"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.055"/></feComponentTransfer>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>
  <g filter="url(#soft)">
    <ellipse cx="96" cy="145" rx="152" ry="159" fill="#A8B59A" opacity="0.50"/>
    <ellipse cx="397" cy="419" rx="122" ry="105" fill="#FDFCFA" opacity="0.50"/>
    <ellipse cx="647" cy="312" rx="244" ry="254" fill="#C9A96A" opacity="0.50"/>
    <ellipse cx="307" cy="30" rx="217" ry="144" fill="#A8B59A" opacity="0.50"/>
    <ellipse cx="47" cy="425" rx="229" ry="234" fill="#FDFCFA" opacity="0.50"/>
  </g>
  <rect width="800" height="600" filter="url(#grain)" opacity="0.5"/>

  <g opacity="0.55" text-anchor="middle">
    <text x="400" y="300" font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="#36413E">Galerie 2</text>
    <text x="400" y="348" font-family="Helvetica, Arial, sans-serif" font-size="15" letter-spacing="1.5" fill="#36413E" opacity="0.65">800 × 600 px</text>
  </g>
</svg>

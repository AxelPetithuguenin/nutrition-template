<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="750" viewBox="0 0 1000 750" role="img" aria-label="Batch cooking">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#F8F6F2"/>
      <stop offset="100%" stop-color="#EFEBE3"/>
    </linearGradient>
    <filter id="soft" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="105"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="23"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.055"/></feComponentTransfer>
    </filter>
  </defs>

  <rect width="1000" height="750" fill="url(#bg)"/>
  <g filter="url(#soft)">
    <ellipse cx="882" cy="678" rx="296" ry="190" fill="#A8B59A" opacity="0.50"/>
    <ellipse cx="583" cy="324" rx="230" ry="153" fill="#C9A96A" opacity="0.50"/>
    <ellipse cx="223" cy="338" rx="175" ry="145" fill="#FDFCFA" opacity="0.50"/>
    <ellipse cx="72" cy="95" rx="263" ry="213" fill="#A8B59A" opacity="0.50"/>
    <ellipse cx="511" cy="533" rx="200" ry="126" fill="#A8B59A" opacity="0.50"/>
  </g>
  <rect width="1000" height="750" filter="url(#grain)" opacity="0.5"/>

  <g opacity="0.55" text-anchor="middle">
    <text x="500" y="375" font-family="Georgia, 'Times New Roman', serif" font-size="37" fill="#36413E">Batch cooking</text>
    <text x="500" y="434" font-family="Helvetica, Arial, sans-serif" font-size="19" letter-spacing="1.5" fill="#36413E" opacity="0.65">journal-3.jpg · 1000 × 750 px</text>
  </g>
</svg>
